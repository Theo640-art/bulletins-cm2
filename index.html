<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bulletins CM2 — Jean des Vignes</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
:root{--bg:#eef0f6;--ink:#1d1d1f;--mut:#6e6e73;--glass:rgba(255,255,255,.62);--line:rgba(255,255,255,.75);--sh:0 1px 0 rgba(255,255,255,.9) inset,0 20px 50px -20px rgba(30,40,90,.25);--a1:#7aa8ff;--a2:#d7a4ff;--a3:#8be9c8;--track:rgba(0,0,0,.07);--paper:#fff;--field:rgba(255,255,255,.8)}
@media(prefers-color-scheme:dark){:root{--bg:#07080d;--ink:#f5f5f7;--mut:#9a9aa3;--glass:rgba(34,36,48,.55);--line:rgba(255,255,255,.1);--sh:0 1px 0 rgba(255,255,255,.08) inset,0 24px 60px -20px rgba(0,0,0,.7);--a1:#2b52c9;--a2:#7a2fc0;--a3:#0f8a6a;--track:rgba(255,255,255,.09);--paper:#1b1c26;--field:rgba(255,255,255,.08)}}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:120px;min-height:100vh}
button,input,select{font-family:inherit;color:inherit}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 22s ease-in-out infinite alternate;translate:calc(var(--px,0)*38px) calc(var(--py,0)*38px);transition:translate 1.4s cubic-bezier(.16,1,.3,1)}
@media(prefers-color-scheme:dark){.aurora i{opacity:.38}}
.aurora i:nth-child(1){background:var(--a1);top:-20%;left:-10%}.aurora i:nth-child(2){background:var(--a2);top:10%;right:-20%;animation-delay:-7s}.aurora i:nth-child(3){background:var(--a3);bottom:-25%;left:25%;animation-delay:-13s}
@keyframes drift{to{transform:translate(8vmax,-6vmax) scale(1.15)}}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
.glass{background:var(--glass);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--line);box-shadow:var(--sh);border-radius:30px}
.hide{display:none!important}
header{max-width:1200px;margin:0 auto;padding:26px 20px 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(24px,5vw,42px);letter-spacing:-.035em;font-weight:700;line-height:1.05}
.sub{color:var(--mut);font-size:13px;margin-bottom:6px;display:flex;gap:10px;align-items:center}
.live{font-size:11px;font-weight:600;color:#1f9d46;background:rgba(48,209,88,.15);padding:2px 9px;border-radius:99px;transition:all .3s}
.live.warn{color:#c77700;background:rgba(255,159,10,.16)}.live.err{color:#ff453a;background:rgba(255,69,58,.14)}
.hr{display:flex;gap:10px;align-items:center}
.seg{display:flex;padding:4px;border-radius:999px;position:relative}
.seg button{all:unset;cursor:pointer;padding:8px 15px;font-size:13px;font-weight:600;border-radius:999px;position:relative;z-index:1;color:var(--mut);transition:color .3s}
.seg button.on{color:var(--ink)}
.pill{position:absolute;top:4px;bottom:4px;border-radius:999px;background:var(--paper);box-shadow:0 2px 10px rgba(0,0,0,.12);transition:all .45s cubic-bezier(.16,1,.3,1)}
.ib{width:42px;height:42px;border-radius:50%;cursor:pointer;font-weight:700;display:grid;place-items:center;border:1px solid var(--line);transition:transform .25s cubic-bezier(.16,1,.3,1)}
.ib:hover{transform:scale(1.08) rotate(-4deg)}
.ib.on{background:var(--ink);color:var(--bg)}
.menu{position:absolute;right:0;top:52px;width:240px;padding:8px;border-radius:22px;z-index:40;animation:pop .3s cubic-bezier(.16,1,.3,1)}
.menu button,.menu label{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;width:100%;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer}
.menu button:hover,.menu label:hover{background:var(--track)}.menu .red{color:#ff453a}.menu hr{border:0;border-top:1px solid var(--track);margin:5px 0}
main{max-width:1200px;margin:0 auto;padding:12px 20px}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c{padding:26px;overflow:hidden}
.hero{grid-column:span 7;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.cnt{grid-column:span 5;display:flex;flex-direction:column;gap:16px}
@media(max-width:860px){.hero,.cnt{grid-column:span 12}}
.s6{grid-column:span 6}.s12{grid-column:span 12}@media(max-width:860px){.s6{grid-column:span 12}}
.lbl{font-size:13px;color:var(--mut);font-weight:600}
.big{font-size:clamp(60px,10vw,120px);font-weight:800;letter-spacing:-.06em;line-height:.9;font-variant-numeric:tabular-nums}.big small{font-size:.28em;font-weight:600;color:var(--mut);letter-spacing:0;margin-left:6px}
.delta{display:inline-flex;gap:6px;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;background:rgba(48,209,88,.16);color:#1f9d46}.delta.neg{background:rgba(255,159,10,.16);color:#c77700}.delta.nul{background:var(--track);color:var(--mut)}
.insrow{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--track)}.insrow.clk{cursor:pointer}.insrow:last-child{border:0}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--track)}.insrow p{font-size:13px;color:var(--mut)}.insrow strong{font-size:15px;display:block}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{padding:14px 12px;border-radius:20px;background:var(--field);border:1px solid var(--line)}
.tile b{display:block;font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}
.tile small{font-size:11px;color:var(--mut);font-weight:600}
.pchips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pc{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:8px 2px;border-radius:14px;background:var(--track);font-size:11px;font-weight:700;color:var(--mut);transition:background .2s, transform .15s}
.pc:active{transform:scale(.96)}
.pc b{display:block;font-size:17px;color:var(--ink)}.pc.on{background:var(--ink);color:var(--bg)}.pc.on b{color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:99px;width:0;transition:width 1s cubic-bezier(.16,1,.3,1)}
.bar.two{position:relative}.bar.two i{position:absolute;left:0;top:0}
.tool{padding:14px 18px;border-radius:24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600;background:var(--track);color:var(--mut);transition:all .2s;white-space:nowrap}
.chip:hover{color:var(--ink);background:var(--field)}
.chip.on{background:var(--ink);color:var(--bg)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 18px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px;text-align:center;transition:transform .15s,filter .2s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn:hover{filter:brightness(1.12);box-shadow:0 8px 20px -10px rgba(10,132,255,.35)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.s{background:var(--field);color:var(--ink);border:1px solid var(--line)}.btn.g{background:#1f9d46;color:#fff}.btn.b{background:#0a84ff;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ev{padding:20px;border-radius:26px;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:transform .25s cubic-bezier(.16,1,.3,1)}
.ev:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-4px)}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px}
.ev h3{font-size:15px}.ev p{font-size:12px;color:var(--mut);font-style:italic;min-height:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{all:unset;cursor:pointer;width:32px;height:32px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-size:14px}

/* ===== Sélecteur d'élève propre sans flèche native décalée ===== */
#selE{
  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;
  cursor:pointer;
  padding:9px 36px 9px 16px!important;
  background-image:url('data:image/svg+xml;utf8,<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="%238e8e93" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><polyline points="6 9 12 15 18 9"/></svg>');
  background-repeat:no-repeat;
  background-position:right 13px center;
  border-radius:14px;
}

/* ===== Effets visuels & halos ===== */
.c,.ev,.tool{position:relative}
.c::before,.ev::before,.tool::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(300px circle at var(--mx,50%) var(--my,50%),rgba(140,170,255,.07),transparent 65%)}
.c:hover::before,.ev:hover::before,.tool:hover::before{opacity:1}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;background:conic-gradient(from var(--ang),transparent 0 68%,var(--a1),var(--a2),var(--a3),transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 7s linear infinite}
body[data-enter] .bento>*,body[data-enter] .grid>*{animation:rise .85s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*55ms)}

/* ===== Dock macOS épuré (point blanc retiré) ===== */
.dock-wrap{
  position:fixed;
  left:0;
  right:0;
  bottom:max(16px, env(safe-area-inset-bottom));
  z-index:35;
  display:flex;
  justify-content:center;
  pointer-events:none;
}
.dock{
  pointer-events:auto;
  display:flex;
  align-items:flex-end;
  gap:12px;
  padding:10px 14px;
  border-radius:30px;
  background:rgba(255,255,255,.68);
  backdrop-filter:blur(36px) saturate(190%);
  -webkit-backdrop-filter:blur(36px) saturate(190%);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 1px 0 rgba(255,255,255,.95) inset, 0 20px 48px -12px rgba(10,20,50,.32);
}
@media(prefers-color-scheme:dark){
  .dock{
    background:rgba(22,24,34,.62);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 1px 0 rgba(255,255,255,.12) inset, 0 22px 55px -12px rgba(0,0,0,.75);
  }
}
.dock-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  width:50px;
  flex-shrink:0;
  will-change:width;
}
.dock-item button{
  all:unset;
  box-sizing:border-box;
  cursor:pointer;
  width:50px;
  height:50px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--mut);
  background:var(--track);
  border:1px solid var(--line);
  box-shadow:0 4px 14px rgba(0,0,0,.06);
  transition:background .2s, color .2s, transform .15s;
}
.dock-item button svg{
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
  pointer-events:none;
}
.dock-item button:hover{
  background:var(--field);
  color:var(--ink);
}
.dock-item button:active{
  transform:scale(.92);
}
.dock-item.on button{
  background:var(--ink);
  color:var(--bg);
  box-shadow:0 8px 22px -6px rgba(0,0,0,.45);
}
.dock .tip{
  position:absolute;
  bottom:calc(100% + 10px);
  left:50%;
  transform:translateX(-50%) translateY(4px);
  font-size:11px;
  font-weight:700;
  color:var(--ink);
  background:var(--paper);
  border:1px solid var(--line);
  padding:5px 11px;
  border-radius:10px;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s, transform .15s;
  white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.16);
  backdrop-filter:blur(12px);
  z-index:40;
}
.dock-item:hover .tip{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ===== Courbe d'évolution ===== */
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes fadeIn{from{opacity:0}}
@keyframes dotin{from{transform:scale(0);opacity:0}}
@keyframes pulse{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2);opacity:0}}
.evo{width:100%;height:auto;display:block;overflow:visible}
.evo text{font-family:inherit;text-anchor:middle;font-variant-numeric:tabular-nums}
.evo .ln{stroke-dasharray:1;animation:draw 1.7s cubic-bezier(.16,1,.3,1) both}
.evo .ar{animation:fadeIn 1.4s .35s both}
.evo .dt{transform-box:fill-box;transform-origin:center;animation:dotin .6s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--k)*.2s + .5s)}
.evo .pl{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.evo .pt{cursor:pointer}
.evo .band{opacity:0;transition:opacity .25s}
.evo .pt:hover .band{opacity:.06}.evo .pt.on .band{opacity:.07}

/* Modales & Champs */
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #0a84ff;outline-offset:2px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.32);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:14px}
.ov>div{animation:pop .35s cubic-bezier(.16,1,.3,1)}
.fld{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--field);font-size:14px;font-weight:600;outline:none;margin-bottom:12px;transition:border-color .2s}
.fld:focus{border-color:#0a84ff}
.mod{width:min(440px,100%);padding:26px}.mod label{font-size:12px;font-weight:600;color:var(--mut);display:block;margin-bottom:5px}
.pw{width:min(360px,100%);padding:36px;text-align:center}
.logo{width:64px;height:64px;border-radius:22px;background:linear-gradient(135deg,#0a84ff,#64d2ff);color:#fff;font-weight:900;display:grid;place-items:center;margin:0 auto 14px}
.sai{width:min(620px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.sai>.hd,.sai>.ft{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px}.sai>.ft{font-size:12px;color:var(--mut)}
.sai .ls{overflow-y:auto;padding:4px 18px;flex:1}
.nr{display:flex;justify-content:space-between;align-items:center;padding:7px 8px;border-radius:14px;gap:8px}.nr:hover{background:var(--track)}
.nr b{font-size:13px}.nr small{color:var(--mut);width:22px;display:inline-block;text-align:right;margin-right:6px}
.q{all:unset;cursor:pointer;font-size:10px;font-weight:700;padding:5px 8px;border-radius:9px;background:var(--track);transition:background .15s}
.q:hover{background:var(--ink);color:var(--bg)}
.ni{display:flex;align-items:center;gap:4px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:5px 10px}.ni input{all:unset;width:42px;text-align:center;font-weight:700;font-size:13px}.ni span{font-size:10px;color:var(--mut);font-weight:700}
.sheet{position:fixed;top:12px;right:12px;bottom:12px;width:min(440px,calc(100vw - 24px));z-index:30;padding:28px;overflow-y:auto;transform:translateX(calc(100% + 24px));transition:transform .55s cubic-bezier(.16,1,.3,1)}.sheet.open{transform:none}
.bt{display:flex;gap:14px;align-items:flex-start;flex-direction:column}@media(min-width:1024px){.bt{flex-direction:row}}
.side{width:100%;padding:14px;flex-shrink:0}@media(min-width:1024px){.side{width:280px}}
.side .lst{max-height:70vh;overflow-y:auto;margin-top:8px}
.si{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:600;transition:background .15s}
.si:hover{background:var(--track)}.si.on{background:var(--ink);color:var(--bg)}
.zone{flex:1;width:100%;overflow-x:auto;padding:24px;border-radius:30px;background:var(--track);display:flex;justify-content:center}
table.cmp{width:100%;font-size:12px;border-collapse:collapse}.cmp th{color:var(--mut);padding:10px 8px;text-align:center}.cmp td{padding:9px 8px;text-align:center;border-top:1px solid var(--track)}.cmp td:first-child,.cmp th:first-child{text-align:left;font-weight:600}
.bulletin-page{width:210mm;height:296mm;max-height:296mm;padding:12mm 14mm;margin:0 auto;background:#fff;color:#0f172a;box-sizing:border-box;box-shadow:0 16px 40px rgba(0,0,0,.15);position:relative;display:flex;flex-direction:column;justify-content:space-between;border-radius:2px;overflow:hidden;flex-shrink:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#printZone{display:none}
@media print{html,body{background:#fff!important;margin:0!important;padding:0!important}body>*:not(#printZone){display:none!important}#printZone{display:block!important}.bulletin-page{margin:0!important;box-shadow:none!important;border-radius:0!important;width:100%!important;height:296mm!important;page-break-after:always;break-after:page;padding:11mm 13mm!important}@page{size:A4 portrait;margin:0}}

/* ===== OPTIMISATION MOBILE EXCLUSIVE (< 768px) ===== */
@media(max-width:768px){
  header{padding:18px 14px 6px;gap:12px}
  main{padding:8px 12px}
  .bento{gap:12px}
  .c{padding:18px;border-radius:22px}
  .tool{padding:12px 14px;border-radius:20px;flex-direction:column;align-items:stretch;gap:10px}
  .tool .chips{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tool .chips:first-child{display:flex;flex-direction:column}
  #selE{width:100%!important}
  .tool .btn{width:100%;padding:11px 12px;font-size:12.5px}
  .side{display:none} /* Sur mobile, la sélection se fait via le sélecteur haut */
  .zone{padding:10px;border-radius:18px}
  .bulletin-page{transform-origin:top center;transform:scale(0.85);margin-bottom:-45mm}
  .dock{padding:6px 10px;gap:16px;border-radius:24px}
  .dock-item{width:46px}
  .dock-item button{width:46px;height:46px;border-radius:14px}
  .dock-item button svg{width:21px;height:21px}
  .dock .tip{display:none} /* Évite l'infobulle fantôme au touch */
  .tiles{grid-template-columns:1fr;gap:8px}
}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>

<div id="auth" class="ov hide"><div id="authCard" class="glass pw">
  <div class="logo">CM2</div><h2 style="font-size:18px">Jean des Vignes</h2><p class="lbl" style="margin:4px 0 18px">Connexion sécurisée · Bulletins scolaires</p>
  <form onsubmit="login(event)"><input type="password" id="pass" class="fld" placeholder="Mot de passe" autocomplete="current-password" required autofocus>
  <p id="aerr" class="hide" style="color:#ff453a;font-size:12px;font-weight:600;margin-bottom:10px"></p>
  <button class="btn" id="lbtn" style="width:100%">Se connecter</button></form>
  <button class="chip" style="margin-top:12px" onclick="resetPw()">Mot de passe oublié ?</button></div></div>

<div id="app" class="hide">
<header>

function resetDock(){
  if(window.innerWidth <= 768) return;
  dockItems.forEach(item=>{
    const btn=item.querySelector("button");
    const svg=btn.querySelector("svg");
    item.style.width=DOCK_BASE+"px";

  });

    const itemCenter=itemRect.left + itemRect.width/2;

/* ---------- courbe d'évolution (P1 à P5) ---------- */
function evoChart(per,n){
  const W=600,H=190,L=50,Rt=50,top=46,bot=H-40,cw=(W-L-Rt)/4,X=i=>L+i*cw;
  const vs=per.filter(x=>x.a!=null).map(x=>x.a);let lo=0,hi=20;
  if(vs.length){const mn=Math.min(...vs),mx=Math.max(...vs),pad=Math.max(1.5,(mx-mn)*.5);lo=Math.max(0,mn-pad);hi=Math.min(20,mx+pad);if(hi-lo<4){lo=Math.max(0,hi-4);hi=lo+4}}
  const Y=v=>bot-(v-lo)/(hi-lo)*(bot-top),pts=per.map((x,i)=>x.a==null?null:[X(i),Y(x.a)]).filter(Boolean);
  let d="";pts.forEach((q,k)=>{if(!k){d="M"+q[0]+" "+q[1];return}const o=pts[k-1],m=(o[0]+q[0])/2;d+=` C${m} ${o[1]} ${m} ${q[1]} ${q[0]} ${q[1]}`});
  const area=pts.length>1?`<path class="ar" d="${d} L${pts[pts.length-1][0]} ${bot} L${pts[0][0]} ${bot}Z" fill="url(#evA)"/>`:"";
  const line=pts.length>1?`<path class="ln" pathLength="1" d="${d}" fill="none" stroke="url(#evL)" stroke-width="4" stroke-linecap="round" style="filter:drop-shadow(0 6px 10px rgba(160,100,255,.45))"/>`:"";
  let k=0;
  const cols=per.map((x,i)=>{const on=x.p===n,cx=X(i),cy=x.a!=null?Y(x.a):bot,lab=`<text x="${cx}" y="${H-12}" font-size="12" font-weight="800" style="fill:var(${on?"--ink":"--mut"})">P${x.p}</text>`;
    const band=`<rect class="band" x="${cx-cw/2+4}" y="6" width="${cw-8}" height="${H-6}" rx="20" style="fill:var(--ink)"/>`;
    let g="";
    if(x.a==null)g=`<circle cx="${cx}" cy="${bot}" r="3.5" fill="none" stroke-width="1.5" stroke-dasharray="2 3" style="stroke:var(--mut)" opacity=".7"/>`;
    else if(on)g=`<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${bot}" stroke-width="1.5" stroke-dasharray="3 4" stroke-linecap="round" style="stroke:var(--mut)" opacity=".6"/>
      <circle class="pl" cx="${cx}" cy="${cy}" r="12" fill="#b57bff"/>
      <circle class="dt" style="--k:${k++}" cx="${cx}" cy="${cy}" r="7" fill="#fff" stroke="#a56bff" stroke-width="3.5"/>
      <rect x="${cx-33}" y="${cy-40}" width="66" height="26" rx="13" style="fill:var(--ink)"/><text x="${cx}" y="${cy-22.5}" font-size="12.5" font-weight="800" style="fill:var(--bg)">${f(x.a)}</text>`;
    else g=`<circle class="dt" style="--k:${k++};fill:var(--paper);stroke:#a56bff" cx="${cx}" cy="${cy}" r="5" stroke-width="2.5"/><text x="${cx}" y="${cy-14}" font-size="11" font-weight="700" style="fill:var(--mut)">${f(x.a)}</text>`;
    return`<g class="pt ${on?"on":""}" onclick="chgP('${x.p}')" role="button" aria-label="Période ${x.p}">${band}${g}${lab}</g>`}).join("");
  return`<svg class="evo" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la moyenne de classe sur l'année"><defs>
    <linearGradient id="evL" x1="0" x2="1"><stop offset="0" stop-color="#5e8bff"/><stop offset=".55" stop-color="#b86bff"/><stop offset="1" stop-color="#ff6fa8"/></linearGradient>
    <linearGradient id="evA" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#b86bff" stop-opacity=".32"/><stop offset="1" stop-color="#b86bff" stop-opacity="0"/></linearGradient></defs>

  const histoStr=calculerHistorique(eleveNom);
  return`<div class="bulletin-page" id="bulletin-${eleveNom.replace(/\s+/g,"-")}"><div>
  <div style="border-bottom:2px solid #0f172a;padding-bottom:4px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:flex-end;"><div><div style="font-size:11pt;font-weight:700;color:#0f172a;font-family:'Libre Baskerville',serif;">École élémentaire Jean des Vignes</div><div style="font-size:8pt;color:#475569;">21200 Bligny-lès-Beaune</div></div><div style="text-align:right;"><div style="font-size:10pt;font-weight:800;color:#0f172a;">BULLETIN SCOLAIRE</div><div style="font-size:8pt;color:#334155;">Année scolaire 2026/2027 &bull; <b>Période ${P}</b></div></div></div>
  <table style="width:100%;border-collapse:collapse;margin-bottom:6px;border:1px solid #0f172a;"><tr style="background-color:#f8fafc;"><td style="padding:4px 8px;width:65%;border-right:1px solid #0f172a;"><span style="font-size:7pt;text-transform:uppercase;color:#64748b;font-weight:700;">Élève :</span><div style="font-size:10.5pt;font-weight:800;color:#0f172a;">${eleveNom}</div></td><td style="padding:4px 8px;"><span style="font-size:7pt;text-transform:uppercase;color:#64748b;font-weight:700;">Classe :</span><div style="font-size:10.5pt;font-weight:800;color:#0f172a;">CM2</div></td></tr></table>
  <table style="width:100%;border-collapse:collapse;margin-bottom:4px;"><thead><tr style="background-color:#e2e8f0;border:1px solid #94a3b8;"><th style="padding:4px 6px;text-align:left;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.4px;color:#0f172a;">Domaines d'enseignement & Évaluations</th><th style="padding:4px 6px;text-align:center;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.4px;width:70px;color:#0f172a;">Note / 20</th>${opt.moyClasse?`<th style="padding:4px 6px;text-align:center;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.4px;width:65px;color:#475569;">Moy. Classe</th>`:""}</tr></thead><tbody>
  ${corps||`<tr><td colspan="${opt.moyClasse?3:2}" style="padding:14px;text-align:center;color:#94a3b8;font-style:italic;border:1px solid #cbd5e1;">Aucune évaluation enregistrée pour cette période.</td></tr>`}
  <tr style="background-color:#e2e8f0;border-top:2px solid #0f172a;font-weight:800;"><td style="padding:4px 6px;font-size:8.5pt;text-align:right;text-transform:uppercase;letter-spacing:0.5px;color:#0f172a;border:1px solid #94a3b8;">Moyenne générale de la période :</td><td style="padding:4px 6px;font-size:9pt;text-align:center;color:#0f172a;border:1px solid #94a3b8;">${moyGen} / 20</td>${opt.moyClasse?`<td style="padding:4px 6px;font-size:9pt;text-align:center;color:#0f172a;border:1px solid #94a3b8;">${moyGenClasse} / 20</td>`:""}</tr></tbody></table>
  ${opt.histo?`<div style="font-size:7.2pt;color:#475569;text-align:right;margin-bottom:4px;">Historique des périodes précédentes : <span>${histoStr}</span></div>`:""}</div>
  <div><div style="font-size:7.5pt;color:#334155;margin-bottom:4px;">Fait à Bligny-lès-Beaune, le ${dateStr}</div>
  <table style="width:100%;border-collapse:collapse;"><tr><td style="width:48%;vertical-align:top;border:1px solid #94a3b8;padding:4px 6px;height:${sigHeight};"><div style="font-size:7.5pt;font-weight:700;color:#0f172a;text-transform:uppercase;letter-spacing:0.4px;">Signature des parents :</div></td><td style="width:4%;"></td>
  <td style="width:48%;vertical-align:top;border:1.5px solid #0f172a;background-color:#ffffff;padding:4px 6px;height:${sigHeight};position:relative;"><div style="font-size:7.5pt;font-weight:700;color:#0f172a;text-transform:uppercase;letter-spacing:0.4px;">La Directrice d'école :</div>
  <div style="position:absolute;top:6px;right:10px;bottom:14px;left:20px;display:flex;align-items:center;justify-content:flex-end;">${sig?`<img src="${sig}" alt="Signature" style="max-height:40px;max-width:120px;object-fit:contain;">`:""}</div>
  <div style="position:absolute;bottom:3px;right:6px;font-size:7.5pt;font-weight:700;color:#0f172a;">Mme Estelle CHIRAT</div></td></tr></table></div></div>`}
const PDFO=n=>({margin:0,filename:n,image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true,logging:false},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}});
function pdfOne(){const el=document.querySelector("#zone .bulletin-page");if(el)html2pdf().set(PDFO(`bulletin_${cur.replace(/\s+/g,"_")}_P${P}.pdf`)).from(el).save()}
function pdfAll(){const b=$("bAll"),lab="Tout télécharger (1 PDF)";b.textContent="Création du livret...";b.style.pointerEvents="none";
  const z=document.createElement("div");z.style.cssText="width:210mm;margin:0;padding:0;background:#fff";
  E.forEach(e=>{const w=document.createElement("div");w.innerHTML=construireHTMLBulletinSobre(e);const p=w.firstElementChild;p.style.cssText+=";margin:0;box-shadow:none;border-radius:0;page-break-after:always;break-after:page";z.appendChild(p)});document.body.appendChild(z);
  const end=()=>{if(z.parentNode)document.body.removeChild(z);b.textContent=lab;b.style.pointerEvents=""};
  html2pdf().set(PDFO(`bulletins_CM2_periode_${P}_complet.pdf`)).from(z).save().then(end).catch(er=>{console.error(er);end();alert("Erreur lors de la génération. Utilisez le bouton 'Imprimer'.")})}
function imprimer(){const z=$("printZone");z.innerHTML="";E.forEach(e=>{const w=document.createElement("div");w.innerHTML=construireHTMLBulletinSobre(e);const p=w.firstElementChild;p.style.cssText+=";margin:0;box-shadow:none;border-radius:0";z.appendChild(p)});setTimeout(()=>{print();z.innerHTML=""},350)}

/* ---------- cloud, signature, sauvegarde ---------- */
let saveT=null,dirty=false,liveT=null;
function setLive(t,cls){const l=$("live");l.textContent="● "+t;l.className="live"+(cls?" "+cls:"")}
function save(now){dirty=true;clearTimeout(saveT);setLive("Modifications…","warn");if(now)flush();else saveT=setTimeout(flush,600)}
function flush(){clearTimeout(saveT);saveT=null;if(!dirty||!auth.currentUser)return;dirty=false;
  docRef.set({baseDonnees:DB,eleves:E,signature:sig||null,derniereMaj:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{if(dirty)return;setLive("Enregistré ✓");clearTimeout(liveT);liveT=setTimeout(()=>{if(!dirty)setLive("En direct")},2000)}).catch(er=>{console.error(er);dirty=true;setLive("Échec de l'enregistrement","err")})}
addEventListener("pagehide",flush);document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
addEventListener("online",()=>{if(dirty)flush()});
function normDB(d){if(!d||typeof d!=="object")return null;const o={};for(let p=1;p<=5;p++){const x=d[p]||{evals:[],notes:{}};if(!Array.isArray(x.evals)||!x.notes||typeof x.notes!=="object"||!x.evals.every(e=>e&&typeof e.id==="string"&&typeof e.titre==="string"&&typeof e.matiere==="string"))return null;o[p]=x}return o}
function lastP(){for(let p=5;p>=1;p--)if(D(p).evals.length)return String(p);return"1"}
function ecouter(){if(unsub)unsub();unsub=docRef.onSnapshot(d=>{
  if(!dirty){
    if(d.exists){
      const x=d.data(),n=normDB(x.baseDonnees);
      if(n)DB=n;
      if(Array.isArray(x.eleves)&&x.eleves.length>0) E=x.eleves;
      if(!cur||!E.includes(cur))cur=E[0]||"";
      sig=typeof x.signature==="string"&&x.signature.startsWith("data:image/")?x.signature:null;
      majSig();
    }
  }
  const was=loaded;let ch=false;if(!userP){const l=lastP();if(l!==P){P=l;F="TOUS";ch=true}}
  loaded=true;$("loader").classList.add("hide");$("rp").textContent=P;if(!was||ch)pills();R();if(!was)enter()},
  err=>{console.error(err);$("loader").classList.remove("hide");$("loader").textContent="Accès refusé : ce compte n'est pas autorisé à lire les notes."})}
function majSig(){$("txtSig").textContent=sig?"Signature active ✓":"Importer signature";$("btnSig").classList.toggle("hide",!sig)}
function importSig(ev){const file=ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=300;c.height=Math.max(1,Math.round(img.height*300/img.width));c.getContext("2d").drawImage(img,0,0,c.width,c.height);sig=c.toDataURL("image/png");majSig();save(true);R()};img.onerror=()=>alert("Image illisible.");img.src=e.target.result};r.readAsDataURL(file);ev.target.value=""}
function delSig(){if(!confirm("Retirer la signature actuelle ?"))return;sig=null;majSig();save(true);R()}
function exportJSON(){const a=document.createElement("a");a.href="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify({baseDonnees:DB,eleves:E},null,2));a.download=`bulletins_cm2_sauvegarde_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove()}
function importJSON(ev){const file=ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=e=>{try{const raw=JSON.parse(e.target.result);const d=normDB(raw.baseDonnees||raw);if(!d)throw 0;if(confirm("Remplacer les données actuelles par cette sauvegarde ?")){DB=d;if(Array.isArray(raw.eleves)&&raw.eleves.length)E=raw.eleves;save(true);R();alert("Restauration terminée avec succès !")}}catch(x){alert("Erreur de fichier JSON.")}};r.readAsText(file);ev.target.value=""}
function resetP(){if(!confirm(`Supprimer toutes les notes de la Période ${P} ?`))return;DB[P]={evals:[],notes:{}};save(true);R()}
$("mbtn").onclick=e=>{e.stopPropagation();$("menu").classList.toggle("hide")};
document.addEventListener("click",e=>{if(!e.target.closest("#menu")&&!e.target.closest("#mbtn"))$("menu").classList.add("hide")});

/* ---------- accès sécurisé (Firebase Auth) ---------- */
let idleT;
function idle(){clearTimeout(idleT);if(auth.currentUser)idleT=setTimeout(()=>{flush();auth.signOut()},30*60*1000)}
["click","keydown","mousemove","touchstart"].forEach(t=>addEventListener(t,idle,{passive:true}));
function login(e){e.preventDefault();const b=$("lbtn"),er=$("aerr");b.disabled=true;er.classList.remove("hide");er.textContent="";
  auth.signInWithEmailAndPassword(EMAIL_COMPTE,$("pass").value).catch(x=>{er.textContent=x.code==="auth/too-many-requests"?"Trop de tentatives. Réessayez dans quelques minutes.":"E-mail ou mot de passe incorrect.";er.classList.remove("hide");const c=$("authCard");c.style.animation="shake .4s";setTimeout(()=>c.style.animation="",450)}).finally(()=>{b.disabled=false;$("pass").value=""})}
function resetPw(){auth.sendPasswordResetEmail(EMAIL_COMPTE).then(()=>alert("Si ce compte existe, un e-mail de réinitialisation vient d'être envoyé.")).catch(()=>alert("Impossible d'envoyer l'e-mail pour le moment."))}
function logout(){flush();auth.signOut()}
auth.onAuthStateChanged(u=>{
  if(u){$("auth").classList.add("hide");$("app").classList.remove("hide");$("loader").classList.remove("hide");$("loader").textContent="Chargement des notes…";ecouter();idle()}
  else{if(unsub){unsub();unsub=null}clearTimeout(saveT);dirty=false;DB=normDB({});E=[];sig=null;loaded=false;userP=false;P="1";F="TOUS";cur="";V="dash";setLive("En direct");
   ["v-dash","evGrid","zone","side","sheet","printZone"].forEach(i=>$(i).innerHTML="");$("sheet").classList.remove("open");$("mSai").classList.add("hide");$("mCre").classList.add("hide");closeK();
   setV("dash");$("app").classList.add("hide");$("auth").classList.remove("hide")}});
</script>
