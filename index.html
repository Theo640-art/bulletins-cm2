<script>
const $=i=>document.getElementById(i);
firebase.initializeApp({apiKey:"AIzaSyDnrlDhDo2tc6z2O7KyM3IuwGroc5tIfPA",authDomain:"bulletins-jdvr.firebaseapp.com",projectId:"bulletins-jdvr",storageBucket:"bulletins-jdvr.firebasestorage.app",messagingSenderId:"21997926025",appId:"1:21997926025:web:a4a44ae594a036f1c4f858",measurementId:"G-EKJFY0XLQV"});

const heat=v=>{if(v==null)return"var(--track)";const t=Math.max(0,Math.min(1,(v-8)/11));return`hsl(${Math.round(25+t*120)} 85% ${58-t*8}% / .${Math.round(35+t*30)})`};

/* ---------- visuels ---------- */
function ring(vals,size,w){const c=size/2;let o=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">`;
 vals.forEach((v,i)=>{const R=c-w/2-i*(w+3),L=2*Math.PI*R;if(R<4)return;o+=`<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="${COL[MAT[i]]}" stroke-opacity=".16" stroke-width="${w}"/><circle class="rg" cx="${c}" cy="${c}" r="${R}" fill="none" stroke="${COL[MAT[i]]}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L}" data-to="${L*(1-(v||0)/20)}" style="transition:stroke-dashoffset 1.3s cubic-bezier(.16,1,.3,1) ${i*90}ms"/>`});return o+"</svg>"}
function play(root){requestAnimationFrame(()=>requestAnimationFrame(()=>{root.querySelectorAll(".rg").forEach(e=>e.style.strokeDashoffset=e.dataset.to);root.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w);
 root.querySelectorAll("[data-count]").forEach(e=>{const to=+e.dataset.count,t0=performance.now();(function k(t){const q=Math.min(1,(t-t0)/1100);e.textContent=f(to*(1-Math.pow(1-q,4)));if(q<1)requestAnimationFrame(k)})(t0)})}))}
function spark(){const pts=[1,2,3,4,5].map(p=>[p,avgC(p)]).filter(x=>x[1]!=null);if(!pts.length)return"";const vs=pts.map(x=>x[1]),mn=Math.min(...vs)-1,mx=Math.max(...vs)+1;
 const xy=pts.map((q,i)=>[20+i*(pts.length>1?260/(pts.length-1):120),66-(q[1]-mn)/(mx-mn)*54]);
 return`<svg viewBox="0 0 300 82" width="100%" height="82"><path d="${xy.map((q,i)=>(i?"L":"M")+q[0]+" "+q[1]).join(" ")}" fill="none" stroke="#0a84ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${xy.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="#0a84ff"/><text x="${q[0]}" y="80" font-size="10" text-anchor="middle" fill="currentColor" opacity=".55">P${pts[i][0]}</text>`).join("")}</svg>`}

/* ---------- tableau de bord (statistiques) ---------- */
function dash(){
 const el=$("v-dash"),cu=D(P),n=+P,pp=prevP(),mp=avgC(P),mpr=pp?avgC(pp):null,d=mp!=null&&mpr!=null?mp-mpr:null;
 const pe=E.map(e=>[e,avgE(P,e)]).filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]);
 const rows=E.map(e=>{const ms=[],tds=[1,2,3,4,5].map(p=>{const a=D(p).evals.length?calculerMoyenne(notesE(p,e)):"-";if(a!=="-")ms.push(parseFloat(a));return`<td ${p===n?'style="font-weight:700;color:#0a84ff;background:rgba(10,132,255,.08)"':""}>${a}</td>`}).join("");
  return`<tr><td onclick="openS('${e}')" style="cursor:pointer">${e}</td>${tds}<td style="font-weight:800;text-align:right">${ms.length?(ms.reduce((a,b)=>a+b,0)/ms.length).toFixed(2)+" / 20":"-"}</td></tr>`}).join("");
 const cmp=`<div class="c glass s12" style="overflow-x:auto"><h3>Comparatif des 17 élèves sur les 5 périodes</h3><p class="lbl" style="margin-bottom:10px">Moyennes de chaque période et moyenne annuelle · cliquez un élève pour ouvrir sa fiche.</p><table class="cmp"><thead><tr><th>Élève</th><th>Période 1</th><th>Période 2</th><th>Période 3</th><th>Période 4</th><th>Période 5</th><th style="text-align:right">Moyenne annuelle</th></tr></thead><tbody>${rows}</tbody></table></div>`;
 if(!cu.evals.length){el.innerHTML=`<div class="c glass s12" style="text-align:center;padding:60px"><h3>Aucune évaluation pour la période ${P}</h3><p class="lbl" style="margin:8px 0 18px">Ajoutez un premier devoir pour voir apparaître les statistiques.</p><button class="btn b" onclick="setV('evals');openCre()">+ Nouvelle évaluation</button></div>`+cmp;return}
 const sm=MAT.map(m=>avgC(P,m));
 const bw=(l,x,c)=>`<div class="c glass s6" ${x?`onclick="openS('${x[0]}')" style="cursor:pointer"`:""}><div class="lbl" style="color:${c}">${l}</div><div class="big" style="font-size:56px;color:${c};margin:10px 0 6px">${x?f(x[1]):"-"}<small>/20</small></div><div style="font-weight:700">${x?x[0]:"-"}</div></div>`;
 const det=cu.evals.map((x,i)=>{const t=Object.values(cu.notes[x.id]||{}).map(parseFloat).filter(v=>!isNaN(v)),c=COL[x.matiere]||"#0a84ff";
  return`<div class="glass" style="padding:18px;border-radius:22px"><div class="row lbl"><b style="color:${c}">#${i+1} ${esc(x.matiere)}</b><span>${t.length}/17 notés</span></div><div style="font-weight:700;margin:4px 0 10px">${esc(x.titre)}</div><div class="row" style="text-align:center;border-top:1px solid var(--track);padding-top:10px;font-size:12px"><div><div class="lbl">Moyenne</div><b>${calculerMoyenne(t)}</b></div><div><div class="lbl">Plus haute</div><b style="color:#1f9d46">${t.length?Math.max(...t).toFixed(2):"-"}</b></div><div><div class="lbl">Plus basse</div><b style="color:#c77700">${t.length?Math.min(...t).toFixed(2):"-"}</b></div></div></div>`}).join("");
 el.innerHTML=`<div class="c glass hero"><div class="lbl">Moyenne de la classe · Période ${P}</div><div class="big"><span data-count="${mp||0}">0</span><small>/20</small></div>
  <div class="row" style="justify-content:flex-start;gap:10px;flex-wrap:wrap"><span class="delta ${d!=null&&d<0?"neg":""}">${d!=null?(d>=0?"▲ +":"▼ ")+f(Math.abs(d))+" pt vs P"+pp:"Première période"}</span>${mpr!=null?`<span class="lbl">Période précédente : ${f(mpr)} / 20</span>`:""}</div>${spark()}</div>
 <div class="c glass rings"><div class="lbl" style="align-self:flex-start">Moyenne de classe par matière</div>${ring(sm,210,12)}<div style="width:100%;display:flex;flex-direction:column;gap:8px">${MAT.map((m,i)=>sm[i]==null?"":`<div><div class="row" style="font-size:12px;font-weight:600"><span><i class="dot" style="background:${COL[m]}"></i>${m}</span><b>${f(sm[i])}</b></div><div class="bar"><i data-w="${sm[i]*5}%" style="background:${COL[m]}"></i></div></div>`).join("")}</div></div>
 ${bw("Meilleure moyenne",pe[0],"#1f9d46")}${bw("Moins bonne moyenne",pe[pe.length-1],"#c77700")}${cmp}
 <div class="c glass s12"><h3>Détails par évaluation (Période ${P})</h3><p class="lbl" style="margin-bottom:14px">Moyenne, plus haute et plus basse note pour chaque devoir.</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${det}</div></div>`;
 play(el)}

function openS(n){const sh=$("sheet"),sm=MAT.map(m=>avgE(P,n,m)),a=avgE(P,n);
 sh.innerHTML=`<button class="x" style="position:absolute;top:18px;right:20px" onclick="closeS()" aria-label="Fermer">✕</button><div class="lbl">${n.split(" ")[0]} · Période ${P}</div><h1 style="font-size:32px;margin:2px 0 14px">${n.split(" ").slice(1).join(" ")}</h1>
 <div style="display:flex;gap:20px;align-items:center">${ring(sm,150,11)}<div><div class="big" style="font-size:56px"><span data-count="${a||0}">0</span></div><div class="lbl">moyenne / 20<br>classe : ${f(avgC(P))}</div></div></div>
 <div style="margin-top:18px">${MAT.map((m,i)=>sm[i]==null?"":`<div class="row" style="margin-top:10px;font-size:13px"><span><i class="dot" style="background:${COL[m]}"></i>${m}</span><b>${f(sm[i])}</b></div><div class="bar"><i data-w="${sm[i]*5}%" style="background:${COL[m]}"></i></div>`).join("")}</div>
 <p class="lbl" style="margin-top:16px">Historique : ${[1,2,3,4,5].map(p=>avgE(p,n)!=null?`P${p} <b style="color:var(--ink)">${f(avgE(p,n))}</b>`:"").filter(Boolean).join(" · ")||"—"}</p>

 const list=ev.filter(x=>F==="TOUS"||x.matiere===F),g=$("evGrid");
 if(!list.length){g.innerHTML=`<div class="glass" style="grid-column:1/-1;padding:60px;text-align:center"><h3>Aucune évaluation affichée</h3><p class="lbl" style="margin-top:6px">Changez de filtre ou ajoutez un nouveau devoir.</p></div>`;return}
 g.innerHTML=list.map(x=>{const i=ev.findIndex(y=>y.id===x.id),no=cu.notes[x.id]||{},nb=Object.values(no).filter(v=>v!==""&&v!=null).length,m=calculerMoyenne(Object.values(no)),c=COL[x.matiere]||"#0a84ff",full=nb===E.length;

  <div><h3>${esc(x.titre)}</h3><p>${esc(x.theme||"")}</p></div>
  <div><div class="row lbl"><span>Statut</span><b style="color:${full?"#1f9d46":"#c77700"}">${full?"✓":"!"} ${nb} / 17</b></div><div class="bar"><i style="width:${nb/E.length*100}%;background:${full?"#30d158":c}"></i></div></div>
  <div class="row"><b>${m!=="-"?m+"/20":"-"}</b><button class="btn s" onclick="openSai(this.closest('.ev').dataset.id)">Saisir</button></div></div>`}).join("")}
function delEv(id){if(!confirm("Supprimer définitivement cette évaluation et ses notes ?"))return;DB[P].evals=DB[P].evals.filter(e=>e.id!==id);delete DB[P].notes[id];save();R()}

function openCre(){$("cMat").innerHTML=MAT.map(m=>`<option>${m}</option>`).join("");$("cTit").value="";subs();$("mCre").classList.remove("hide");setTimeout(()=>$("cTit").focus(),100)}
function creer(){const titre=$("cTit").value.trim();if(!titre){$("cTit").focus();return}
 if(!DB[P])DB[P]={evals:[],notes:{}};const id="ev_"+Date.now();DB[P].evals.push({id,matiere:$("cMat").value,theme:$("cThe").value,titre});DB[P].notes[id]={};save();$("mCre").classList.add("hide");R();openSai(id)}
function openSai(id){evId=id;const cu=D(P),i=cu.evals.findIndex(e=>e.id===id);if(i<0)return;const x=cu.evals[i],c=COL[x.matiere]||"#0a84ff";
 $("sBadge").textContent=`#${i+1} ${x.matiere}`;$("sBadge").style.cssText=`background:${c}22;color:${c}`;$("sTit").textContent=x.titre;$("sThe").textContent=x.theme?"Sous-domaine : "+x.theme:"";
 $("sList").innerHTML=E.map((e,k)=>`<div class="nr"><span><small>${k+1}.</small><b>${e}</b></span><span class="row">${["20","10","NE","ABS"].map(v=>`<button class="q" onclick="rn(${k},'${v}')">${v}</button>`).join("")}<span class="ni"><input type="text" value="${esc((cu.notes[id]||{})[e]||"")}" placeholder="-" data-i="${k}" oninput="setNote(${k},this.value,this)" onkeydown="nav(event,${k})"><span>/20</span></span></span></div>`).join("");
 $("mSai").classList.remove("hide");setTimeout(()=>{const a=document.querySelector('[data-i="0"]');if(a){a.focus();a.select()}},50)}
const inp=k=>document.querySelector(`[data-i="${k}"]`);
function rn(k,v){setNote(k,v,inp(k));const n=inp(k+1);if(n){n.focus();n.select()}}

 if(r===""||r==="-")o="";else if(["NE","ABS","DISP"].includes(r))o=r;else{const n=parseFloat(r);if(!isNaN(n)&&n>=0&&n<=20)o=String(n);else if(r.length>2)o="";else o=r}
 if(el)el.value=o;if(!DB[P].notes[evId])DB[P].notes[evId]={};DB[P].notes[evId][E[k]]=o;save()}

    sl+=`<tr><td style="padding:${cellPad};font-size:${fontSize};color:#0f172a;border:1px solid #cbd5e1;line-height:1.2;">${esc(dev.titre)}</td><td style="padding:${cellPad};font-size:${fontSize};font-weight:700;text-align:center;border:1px solid #cbd5e1;width:70px;">${an}</td>${opt.moyClasse?`<td style="padding:${cellPad};font-size:${fontSize};color:#64748b;text-align:center;border:1px solid #cbd5e1;width:65px;">${dev.moyClasse!=="-"?dev.moyClasse:"-"}</td>`:""}</tr>`})}
  const mm=calculerMoyenne(nm),mc=moyClasseParMatiereMap[matiere]||"-";
  corps+=`<tr style="background-color:#f1f5f9;font-weight:700;"><td style="padding:${headerPad};font-size:${fontSize};color:#0f172a;border:1px solid #94a3b8;text-transform:uppercase;letter-spacing:0.3px;">${esc(matiere)}</td><td style="padding:${headerPad};font-size:${fontSize};text-align:center;border:1px solid #94a3b8;color:#0f172a;">${mm!=="-"?mm:"-"}</td>${opt.moyClasse?`<td style="padding:${headerPad};font-size:${fontSize};text-align:center;border:1px solid #94a3b8;color:#0f172a;font-weight:700;">${mc!=="-"?mc:"-"}</td>`:""}</tr>${sl}`}
 const moyGen=calculerMoyenne(allNotesEleve);let moyGenClasse="-";if(opt.moyClasse)moyGenClasse=calculerMoyenne(notesC(P));
 const histoStr=calculerHistorique(eleveNom);
 return`<div class="bulletin-page" id="bulletin-${eleveNom.replace(/\s+/g,"-")}"><div>
 <div style="border-bottom:2px solid #0f172a;padding-bottom:4px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:flex-end;"><div><div style="font-size:11pt;font-weight:700;color:#0f172a;font-family:'Libre Baskerville',serif;">École élémentaire Jean des Vignes</div><div style="font-size:8pt;color:#475569;">21200 Bligny-lès-Beaune</div></div><div style="text-align:right;"><div style="font-size:10pt;font-weight:800;color:#0f172a;">BULLETIN SCOLAIRE</div><div style="font-size:8pt;color:#334155;">Année scolaire 2026/2027 &bull; <b>Période ${P}</b></div></div></div>
 <table style="width:100%;border-collapse:collapse;margin-bottom:6px;border:1px solid #0f172a;"><tr style="background-color:#f8fafc;"><td style="padding:4px 8px;width:65%;border-right:1px solid #0f172a;"><span style="font-size:7pt;text-transform:uppercase;color:#64748b;font-weight:700;">Élève :</span><div style="font-size:10.5pt;font-weight:800;color:#0f172a;">${eleveNom}</div></td><td style="padding:4px 8px;"><span style="font-size:7pt;text-transform:uppercase;color:#64748b;font-weight:700;">Classe :</span><div style="font-size:10.5pt;font-weight:800;color:#0f172a;">CM2</div></td></tr></table>
 <table style="width:100%;border-collapse:collapse;margin-bottom:4px;"><thead><tr style="background-color:#e2e8f0;border:1px solid #94a3b8;"><th style="padding:4px 6px;text-align:left;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.4px;color:#0f172a;">Domaines d'enseignement & Évaluations</th><th style="padding:4px 6px;text-align:center;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.4px;width:70px;color:#0f172a;">Note / 20</th>${opt.moyClasse?`<th style="padding:4px 6px;text-align:center;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.4px;width:65px;color:#475569;">Moy. Classe</th>`:""}</tr></thead><tbody>
 ${corps||`<tr><td colspan="${opt.moyClasse?3:2}" style="padding:14px;text-align:center;color:#94a3b8;font-style:italic;border:1px solid #cbd5e1;">Aucune évaluation enregistrée pour cette période.</td></tr>`}
 <tr style="background-color:#e2e8f0;border-top:2px solid #0f172a;font-weight:800;"><td style="padding:4px 6px;font-size:8.5pt;text-align:right;text-transform:uppercase;letter-spacing:0.5px;color:#0f172a;border:1px solid #94a3b8;">Moyenne générale de la période :</td><td style="padding:4px 6px;font-size:9pt;text-align:center;color:#0f172a;border:1px solid #94a3b8;">${moyGen} / 20</td>${opt.moyClasse?`<td style="padding:4px 6px;font-size:9pt;text-align:center;color:#0f172a;border:1px solid #94a3b8;">${moyGenClasse} / 20</td>`:""}</tr></tbody></table>
 ${opt.histo?`<div style="font-size:7.2pt;color:#475569;text-align:right;margin-bottom:4px;">Historique des périodes précédentes : <span>${histoStr}</span></div>`:""}</div>
 <div><div style="font-size:7.5pt;color:#334155;margin-bottom:4px;">Fait à Bligny-lès-Beaune, le ${dateStr}</div>
 <table style="width:100%;border-collapse:collapse;"><tr><td style="width:48%;vertical-align:top;border:1px solid #94a3b8;padding:4px 6px;height:${sigHeight};"><div style="font-size:7.5pt;font-weight:700;color:#0f172a;text-transform:uppercase;letter-spacing:0.4px;">Signature des parents :</div></td><td style="width:4%;"></td>
 <td style="width:48%;vertical-align:top;border:1.5px solid #0f172a;background-color:#ffffff;padding:4px 6px;height:${sigHeight};position:relative;"><div style="font-size:7.5pt;font-weight:700;color:#0f172a;text-transform:uppercase;letter-spacing:0.4px;">La Directrice d'école :</div>
 <div style="position:absolute;top:6px;right:10px;bottom:14px;left:20px;display:flex;align-items:center;justify-content:flex-end;">${sig?`<img src="${sig}" alt="Signature" style="max-height:40px;max-width:120px;object-fit:contain;">`:""}</div>
 <div style="position:absolute;bottom:3px;right:6px;font-size:7.5pt;font-weight:700;color:#0f172a;">Mme Estelle CHIRAT</div></td></tr></table></div></div>`}
const PDFO=n=>({margin:0,filename:n,image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true,logging:false},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}});
function pdfOne(){const el=document.querySelector("#zone .bulletin-page");if(el)html2pdf().set(PDFO(`bulletin_${cur.replace(/\s+/g,"_")}_P${P}.pdf`)).from(el).save()}
function pdfAll(){const b=$("bAll");b.textContent="Création du livret...";b.style.pointerEvents="none";
 const z=document.createElement("div");z.style.cssText="width:210mm;margin:0;padding:0;background:#fff";
 E.forEach(e=>{const w=document.createElement("div");w.innerHTML=construireHTMLBulletinSobre(e);const p=w.firstElementChild;p.style.cssText+=";margin:0;box-shadow:none;border-radius:0;page-break-after:always;break-after:page";z.appendChild(p)});document.body.appendChild(z);
 const end=()=>{if(z.parentNode)document.body.removeChild(z);b.textContent="Télécharger tout (17 PDF)";b.style.pointerEvents=""};
 html2pdf().set(PDFO(`bulletins_CM2_periode_${P}_complet.pdf`)).from(z).save().then(end).catch(er=>{console.error(er);end();alert("Erreur lors de la génération. Utilisez le bouton 'Imprimer'.")})}
function imprimer(){const z=$("printZone");z.innerHTML="";E.forEach(e=>{const w=document.createElement("div");w.innerHTML=construireHTMLBulletinSobre(e);const p=w.firstElementChild;p.style.cssText+=";margin:0;box-shadow:none;border-radius:0";z.appendChild(p)});setTimeout(()=>{print();z.innerHTML=""},350)}

/* ---------- cloud, signature, sauvegarde ---------- */
function save(){docRef.set({baseDonnees:DB,signature:sig||null,derniereMaj:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}
function normDB(d){if(!d||typeof d!=="object")return null;const o={};for(let p=1;p<=5;p++){const x=d[p]||{evals:[],notes:{}};if(!Array.isArray(x.evals)||!x.notes||typeof x.notes!=="object"||!x.evals.every(e=>e&&typeof e.id==="string"&&typeof e.titre==="string"&&typeof e.matiere==="string"))return null;o[p]=x}return o}
function lastP(){const has=x=>Object.values(x||{}).some(v=>v!==""&&v!=null);for(let p=5;p>=1;p--)if(D(p).evals.some(e=>has(D(p).notes[e.id])))return String(p);for(let p=5;p>=1;p--)if(D(p).evals.length)return String(p);return"1"}
function ecouter(){if(unsub)unsub();unsub=docRef.onSnapshot(d=>{
 if(d.exists){const x=d.data(),n=normDB(x.baseDonnees);if(n)DB=n;sig=typeof x.signature==="string"&&x.signature.startsWith("data:image/")?x.signature:null;majSig()}else save();
 const was=loaded;let ch=false;if(!userP){const l=lastP();if(l!==P){P=l;F="TOUS";ch=true}}
 loaded=true;$("loader").classList.add("hide");$("rp").textContent=P;if(!was||ch)pills();R()},
 err=>{console.error(err);$("loader").classList.remove("hide");$("loader").textContent="Accès refusé : ce compte n'est pas autorisé à lire les notes."})}
function majSig(){$("txtSig").textContent=sig?"Signature active ✓":"Importer signature";$("btnSig").classList.toggle("hide",!sig)}
function importSig(ev){const file=ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=300;c.height=img.height*300/img.width;c.getContext("2d").drawImage(img,0,0,c.width,c.height);sig=c.toDataURL("image/png");majSig();save();R()};img.src=e.target.result};r.readAsDataURL(file)}
function delSig(){if(!confirm("Retirer la signature actuelle ?"))return;sig=null;majSig();save();R()}
function exportJSON(){const a=document.createElement("a");a.href="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(DB,null,2));a.download=`bulletins_cm2_sauvegarde_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove()}
function importJSON(ev){const file=ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=e=>{try{const d=normDB(JSON.parse(e.target.result));if(!d)throw 0;if(confirm("Remplacer les données actuelles par cette sauvegarde ?")){DB=d;save();R();alert("Restauration terminée avec succès !")}}catch(x){alert("Erreur de fichier JSON.")}};r.readAsText(file)}
function resetP(){if(!confirm(`Supprimer toutes les notes de la Période ${P} ?`))return;DB[P]={evals:[],notes:{}};save();R()}
$("mbtn").onclick=e=>{e.stopPropagation();$("menu").classList.toggle("hide")};
document.addEventListener("click",e=>{if(!e.target.closest("#menu"))$("menu").classList.add("hide")});

/* ---------- accès sécurisé (Firebase Auth) ---------- */
let idleT;
function idle(){clearTimeout(idleT);if(auth.currentUser)idleT=setTimeout(()=>auth.signOut(),30*60*1000)}
["click","keydown","mousemove","touchstart"].forEach(t=>addEventListener(t,idle,{passive:true}));
function login(e){e.preventDefault();const b=$("lbtn"),er=$("aerr");b.disabled=true;er.classList.add("hide");
 auth.signInWithEmailAndPassword(EMAIL_COMPTE,$("pass").value).catch(x=>{er.textContent=x.code==="auth/too-many-requests"?"Trop de tentatives. Réessayez dans quelques minutes.":"E-mail ou mot de passe incorrect.";er.classList.remove("hide");const c=$("authCard");c.style.animation="shake .4s";setTimeout(()=>c.style.animation="",450)}).finally(()=>{b.disabled=false;$("pass").value=""})}
function resetPw(){const m=EMAIL_COMPTE;auth.sendPasswordResetEmail(m).then(()=>alert("Si ce compte existe, un e-mail de réinitialisation vient d'être envoyé.")).catch(()=>alert("Impossible d'envoyer l'e-mail pour le moment."))}
function logout(){auth.signOut()}
auth.onAuthStateChanged(u=>{
 if(u){$("auth").classList.add("hide");$("app").classList.remove("hide");$("loader").classList.remove("hide");$("loader").textContent="Chargement des notes…";ecouter();idle()}
 else{if(unsub){unsub();unsub=null}DB=normDB({});sig=null;loaded=false;userP=false;P="1";F="TOUS";cur=E[0];
  ["v-dash","evGrid","zone","side","sheet","printZone"].forEach(i=>$(i).innerHTML="");$("sheet").classList.remove("open");$("mSai").classList.add("hide");$("mCre").classList.add("hide");
  $("app").classList.add("hide");$("auth").classList.remove("hide")}});
</script>
